[build-system]
requires = ["setuptools>=61.0", "setuptools-scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tomatowur"
authors = [
    { name = "Bart van Marrewijk", email = "bart.vanmarrewijk@wur.nl" },
]
description = "set of functions for common deeplearning tasks."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["deeplearning", "AI", "images"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
]

dependencies = [
    "numpy==2.2.5",
    "torch",
    "polyscope",
    "tqdm",
    "requests",
    "pandas",
    "natsort",
    "omegaconf",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "ipykernel",
    "opencv_python",
    "MiniSom==2.3.5",
    "mistree",
    "open3d==0.19.0",
    "networkx",
    "hydra-core==1.3.2",
    "seaborn==0.13.2",
    "scikit-image==0.25.2",
    "robust_laplacian",
]

dynamic = ["version"]

[project.urls]
GitHub = "https://github.com/WUR-ABE/TomatoWUR"

[project.scripts]
wurtomato = "tomatowur.wurTomato:main"

[project.optional-dependencies]
test = [
]

dev = [
    "pre-commit>=3.5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "tomatowur.__version__"}

[tool.pylint.'MASTER']
ignore-patterns="_version.py"
load-plugins = "pylint_pydantic"

[tool.pylint.'VARIABLES']
max-line-length=100

[tool.ruff]
exclude = ["_version.py", "ui_files"]
line-length = 100

[tool.bandit]
target = ["tomatowur", "tests"]
tests = [
    "B101",  # Use of assert
    "B301",  # Pickle usage
    "B303",  # MD5 usage
    "B304",  # Insecure cipher modes
    "B310",  # Audit URL open
    "B318",  # Insecure XML processing
    "B314",  # Insecure SSL/TLS settings
    "B403",  # subprocess import
    "B404",  # os.system usage
    "B413",  # requests with verify=False
    "B504",  # SSL with insecure settings
    "B605",  # start_process_with_a_shell
    "B607"   # start_process_as_root
]

[tool.bandit.assert_used]
skips = ['*_test.py', '*/test_*.py']

[tool.mypy]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = []
ignore_missing_imports = true
